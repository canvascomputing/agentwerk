[package]
name = "agentwerk-py"
version = "0.1.33"
edition = "2021"
license = "MIT"
repository = "https://github.com/canvascomputing/agentwerk"
description = "Python bindings for agentwerk, a minimal crate for building LLM agents"
publish = false

[lib]
name = "_agentwerk"
crate-type = ["cdylib"]

[dependencies]
agentwerk = { path = "../agentwerk" }
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py310"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
pythonize = "0.29.0"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
