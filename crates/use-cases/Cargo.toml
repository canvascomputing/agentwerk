[package]
name = "use-cases"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
agentwerk = { path = "../agentwerk" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "http2", "charset", "system-proxy"] }

[[bin]]
name = "hello-world"
path = "src/hello_world/main.rs"

[[bin]]
name = "deep-research"
path = "src/deep_research/main.rs"

[[bin]]
name = "terminal-repl"
path = "src/terminal_repl/main.rs"

[[bin]]
name = "coding-harness"
path = "src/coding_harness/main.rs"

[[bin]]
name = "malware-scanner"
path = "src/malware_scanner/main.rs"
