[package]
name = "agentwerk"
version = "0.1.33"
edition = "2021"
license = "MIT"
description = "A minimal Rust crate that gives any application agentic capabilities."
repository = "https://github.com/canvascomputing/agentwerk"
readme = "../../README.md"
keywords = ["agent", "llm", "ai", "tools", "agentic"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "charset", "system-proxy"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "process", "time", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
regex = "1.13.1"
grep = "0.4.1"
ignore = "0.4.33"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "process", "time", "signal", "test-util"] }

[[bench]]
name = "aql"
harness = false
